# electron-builder 配置（M4 §3 / U-M4-04）。
#
# 结构决策：
# - asar: true；files 只进 dist（renderer 产物 + main/preload 单文件 CJS）与 package.json；
# - harness 运行树由 scripts/m4/stage-harness.mjs 物化到 resources/harness-stage
#   （dsh 及其生产依赖经 pnpm deploy 物化，无 junction、无开发机绝对路径），
#   再由 extraResources 复制到安装目录 <resources>/vendor/deepseek-harness，
#   使 src/adapters/engine/harness/sdk.ts 现有 findRepoRoot 上溯解析在打包态继续成立（不改 sdk.ts）；
# - 不使用 asarUnpack（M4 §3 禁止扩大 unpacked 面）；
# - MCP server 分发为已知缺口：main 的 resolveMcpServerPath() 打包态解析到 asar 内路径，
#   子进程 node 不可读，属 main 业务逻辑，另行裁决（见 s16 证据 summary）。
appId: dev.cadreheihei.app
productName: cadre-heihei
directories:
  output: release
files:
  - dist/**/*
  - '!dist/mcp/**'
  - package.json
asar: true
npmRebuild: false
# s17 实测：LZMA 默认档在 2.7GB/10 万文件载荷下 7za 管线 RangeError 崩溃；
# 先以 store（不压缩）保通过，体积代价记入发布说明；后续再调档实测。
compression: store
win:
  target:
    - target: nsis
      arch:
        - x64
nsis:
  # 静默可验证：/S /D=<dir>；装完不自启（取证流程自行受控启动）；
  # 卸载保留 userData（deleteAppDataOnUninstall=false 为 NSIS 默认，显式声明）。
  # differentialPackage/useZip：s17 两次实测默认差分 7z 管线（execFile 回调 join）
  # 在 2.6GB 载荷下 RangeError（builder-util exec maxBuffer 1GB + V8 string 上限）；
  # 改 zip + 无差分 + store 绕开（代价：无差分自动更新基线、安装包近原始体积，首版可接受）。
  oneClick: true
  perMachine: false
  runAfterFinish: false
  deleteAppDataOnUninstall: false
  allowToChangeInstallationDirectory: false
  differentialPackage: false
  useZip: true
extraResources:
  # s25 起 harness 运行树改为官方 prepare-dsh 产物（自包含零链接包形态，439MB，
  # 替代 stage-harness 全量复制 741MB；s24 桥接 probe "pong"+list_roster 验证通过）。
  # 安装目录 <resources>/dsh 与 src/main/dsh-path.ts 打包态 resolveDshBin 约定一致：
  #   <resources>/dsh/node_modules/@deepseek-ai/dsh/lib/bin.js
  # 回退方式：恢复下行 stage 复制（resources/harness-stage/vendor → vendor）并重跑
  #   node scripts/m4/stage-harness.ts。
  # - from: resources/harness-stage/vendor
  #   to: vendor
  - from: ../vendor/deepseek-harness/apps/desktop/.desktop-build/targets/win-x64/dsh
    to: dsh
    # s25 实测：builder 默认复制滤掉 node_modules（dsh 只剩 4MB manifest）；
    # filter 显式列出全量内容。
    filter:
      - package.json
      - desktop-runtime.json
      - node_modules/**/*
  # MCP server 单文件 CJS 落真实磁盘（asar 内路径子进程不可读）；
  # nodeCommand=process.execPath（electron.exe）+ patch env ELECTRON_RUN_AS_NODE=1 拉起。
  - from: dist/mcp
    to: app.mcp
